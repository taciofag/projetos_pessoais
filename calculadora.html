<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Simples</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      --bg: linear-gradient(135deg, #1f1c2c, #928dab);
      --panel-bg: rgba(255, 255, 255, 0.12);
      --panel-border: rgba(255, 255, 255, 0.35);
      --button-bg: rgba(255, 255, 255, 0.18);
      --button-hover: rgba(255, 255, 255, 0.28);
      --accent: #ffca3a;
      --text: #f3f3f3;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
    }

    .calculator {
      width: min(360px, 90vw);
      padding: 1.5rem;
      border-radius: 1.5rem;
      backdrop-filter: blur(20px);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.35);
      display: grid;
      gap: 1rem;
    }

    .display {
      background: rgba(0, 0, 0, 0.35);
      border: none;
      border-radius: 0.75rem;
      padding: 1rem;
      font-size: 2.5rem;
      text-align: right;
      color: var(--text);
      letter-spacing: 0.05em;
    }

    .display:focus {
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
    }

    button {
      border: none;
      border-radius: 0.75rem;
      padding: 0.85rem;
      font-size: 1.15rem;
      background: var(--button-bg);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button:hover {
      background: var(--button-hover);
    }

    button:active {
      transform: scale(0.97);
    }

    .span-two {
      grid-column: span 2;
    }

    .accent {
      background: var(--accent);
      color: #2e2a2a;
      font-weight: 600;
    }

    .accent:hover {
      background: #ffd760;
    }
  </style>
</head>
<body>
  <div class="calculator" role="application" aria-label="Calculadora">
    <input id="display" class="display" type="text" value="0" aria-live="polite" readonly />
    <div class="buttons">
      <button type="button" data-action="clear">C</button>
      <button type="button" data-action="backspace">⌫</button>
      <button type="button" data-value="/">÷</button>
      <button type="button" data-value="*">×</button>

      <button type="button" data-value="7">7</button>
      <button type="button" data-value="8">8</button>
      <button type="button" data-value="9">9</button>
      <button type="button" data-value="-">−</button>

      <button type="button" data-value="4">4</button>
      <button type="button" data-value="5">5</button>
      <button type="button" data-value="6">6</button>
      <button type="button" data-value="+">+</button>

      <button type="button" data-value="1">1</button>
      <button type="button" data-value="2">2</button>
      <button type="button" data-value="3">3</button>
      <button type="button" data-action="equals" class="accent">=</button>

      <button type="button" data-value="0" class="span-two">0</button>
      <button type="button" data-value=".">,</button>
    </div>
  </div>

  <script>
    (function () {
      const display = document.getElementById('display');
      const buttons = document.querySelectorAll('.buttons button');
      let expression = '';
      let showingError = false;

      const updateDisplay = () => {
        if (showingError) {
          display.value = 'Erro';
          return;
        }
        display.value = expression || '0';
      };

      const appendValue = (value) => {
        if (showingError) {
          showingError = false;
          expression = '';
        }
        const lastChar = expression.slice(-1);
        const operators = ['+', '-', '*', '/'];
        if (operators.includes(value)) {
          if (!expression || operators.includes(lastChar)) {
            return;
          }
        }
        if (value === '.') {
          const parts = expression.split(/[-+*/]/);
          const currentNumber = parts[parts.length - 1];
          if (currentNumber.includes('.')) {
            return;
          }
        }
        expression += value;
        updateDisplay();
      };

      const clearAll = () => {
        expression = '';
        showingError = false;
        updateDisplay();
      };

      const backspace = () => {
        if (showingError) {
          clearAll();
          return;
        }
        expression = expression.slice(0, -1);
        updateDisplay();
      };

      const evaluateExpression = () => {
        if (!expression) {
          return;
        }
        try {
          const result = Function(`"use strict"; return (${expression})`)();
          expression = Number.isFinite(result) ? String(result) : '';
          showingError = !expression;
        } catch (error) {
          expression = '';
          showingError = true;
        }
        updateDisplay();
      };

      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          const { action, value } = button.dataset;
          if (action === 'clear') {
            clearAll();
          } else if (action === 'backspace') {
            backspace();
          } else if (action === 'equals') {
            evaluateExpression();
          } else if (value) {
            appendValue(value);
          }
        });
      });

      document.addEventListener('keydown', (event) => {
        const { key } = event;
        if (/^[0-9]$/.test(key)) {
          appendValue(key);
          return;
        }
        if (['+', '-', '*', '/'].includes(key)) {
          appendValue(key);
          event.preventDefault();
          return;
        }
        if (key === 'Enter' || key === '=') {
          evaluateExpression();
          event.preventDefault();
          return;
        }
        if (key === 'Backspace') {
          backspace();
          event.preventDefault();
          return;
        }
        if (key === 'Delete') {
          clearAll();
          event.preventDefault();
          return;
        }
        if (key === ',' || key === '.') {
          appendValue('.');
          event.preventDefault();
        }
      });

      updateDisplay();
    })();
  </script>
</body>
</html>
